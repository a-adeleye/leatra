<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thank you for contacting Leatra." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <meta http-equiv="refresh" content="5;url=/" />
    <title>Thank you | Leatra</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" /></noscript>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="confirmation-page">
    <main class="confirmation-shell" id="main-content">
      <a class="confirmation-logo" href="/" aria-label="Leatra home">
        <img src="assets/images/leatra-logo-official.png" alt="Leatra" width="600" height="400" />
      </a>

      <section class="confirmation-card" aria-labelledby="confirmation-title" role="status">
        <span class="confirmation-mark" aria-hidden="true">✓</span>
        <p class="confirmation-kicker">Message received</p>
        <h1 id="confirmation-title">Thank you.</h1>
        <p>We’ll be in touch soon. You’ll return to the Leatra homepage in a moment.</p>
        <span class="confirmation-progress" aria-hidden="true"><span></span></span>
        <a class="confirmation-link" href="/">Return now <span aria-hidden="true">→</span></a>
      </section>
    </main>

    <script>
      window.setTimeout(() => window.location.replace("/"), 5000);
    </script>
  </body>
</html>
